
name: Schedule CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"

      - name: Check Python line length
        run: python check_lines.py

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [validate, unit_tests]
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Create package
        run: |
          mkdir -p dist
          cp schedule.py README.md Dockerfile schedule.json.example dist/
          cd dist
          sha256sum schedule.py README.md Dockerfile schedule.json.example > manifest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-package
          path: dist/
          retention-days: 7

  deploy_test:
    name: Deploy Test
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'workflow_dispatch'
    environment: test/schedule
    env:
      APP_PORT: 8110
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: schedule-package
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"

      - name: Check deployment configuration
        run: |
          test -n "$DEPLOY_TOKEN" || (echo "DEPLOY_TOKEN is missing" && exit 1)
          echo "APP_PORT=$APP_PORT"

      - name: Smoke test
        run: |
          ls -la dist
          cd dist
          python schedule.py
          echo "Deployment smoke test completed." > deployment.txt

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: dist/deployment.txt
          retention-days: 7
